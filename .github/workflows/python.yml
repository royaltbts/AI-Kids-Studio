name: TinyVerse CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            fastapi \
            uvicorn \
            pydantic \
            pytest \
            pytest-cov \
            anyio \
            ruff

      - name: Compile Python Files
        run: |
          python -m compileall backend

      - name: Run Ruff
        run: |
          ruff check .

      - name: Run Unit Tests
        run: |
          pytest tests/unit -v

      - name: Display Success
        if: success()
        run: |
          echo "✅ TinyVerse CI completed successfully."