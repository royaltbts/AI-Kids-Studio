name: TinyVerse CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile
        run: |
          python -m compileall backend

      - name: Ruff
        run: |
          ruff check .

      - name: Run Tests
        run: |
          pytest tests/unit -v